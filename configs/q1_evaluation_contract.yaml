# Q1 Evaluation Protocol — canonical offline contract (no live eval authorization).
schema_version: 1
protocol_id: Q1-EVAL-PROTOCOL-0.1
status: NEEDS_DECISION  # owner sign-off before live

dataset:
  pack_id: vnext_confirm_v1.0
  path: datasets/frozen/vnext_confirm_v1/dataset.jsonl
  sha256: "523c881820710783b5290c76ea5fe5fc01a6341fb427defcba1119fc3e721518"
  n_attack: 61
  n_benign: 61
  attack_benign_split: separate_endpoints  # ASR on attacks; U/FPR on benign — do not pool N

arms:
  B0:
    role: baseline
    defense_resolver_key: B0
    factory: make_b0_no_defense
  B1:
    role: static_defense
    defense_resolver_key: NEEDS_DECISION  # candidate: B1 | STATIC-A3 | STATIC-A1 — owner pick
    factory: NEEDS_DECISION
  B2:
    role: adaptive_multi_turn_defense
    defense_resolver_key: NEEDS_DECISION  # align with b2_adaptive_contract live conditions
    factory: NEEDS_DECISION
    adaptive_contract_ref: adapti_guard.evaluation.b2_adaptive_contract
    max_turns: 3  # LIVE_WIRING_MAX_TURNS in b2_adaptive_contract.py
    episode_judgment: final_turn_only  # MULTI_TURN_SUCCESS_SEMANTICS in b2_matrix_contract

primary_targets:
  count: 4
  registry_path: configs/models_q1_eval_panel.yaml
  config_keys:
    - q1_primary_qwen3_30b_a3b
    - q1_primary_gemma_3_27b
    - q1_primary_mistral_small_3_2_24b
    - q1_primary_llama_3_3_70b

supplementary_targets:
  count: 2
  registry_path: configs/models_q1_eval_panel.yaml
  config_keys:
    - q1_supplementary_openai_gpt_5_4
    - q1_supplementary_anthropic_claude_sonnet_5
  execution_policy: cost_constrained_only
  subset:
    path: NEEDS_DECISION  # frozen subset manifest + sha required before live
    sha256: NEEDS_DECISION
    selection_rule: predefined_before_results  # no post-hoc selection
  merge_with_primary_comparisons: false

judges:
  J1_primary:
    config_key: q1_judge_deepseek_v4_flash
    registry_path: configs/models_q1_eval_panel.yaml
    openrouter_model_id: NEEDS_DECISION  # must verify on OpenRouter before live
  J2_agreement:
    config_key: q1_judge_grok_4_7
    registry_path: configs/models_q1_eval_panel.yaml
    openrouter_model_id: NEEDS_DECISION
    scope: frozen_subset_only  # same subset as supplementary gate; sha MUST match subset.sha256

primary_episode_budget:
  attack_episodes: NEEDS_DECISION  # owner locks N; derived = n_attack * n_primary_targets * n_arms
  formula: "n_attack * n_primary_targets * n_arms"
  benign_episodes: NEEDS_DECISION

budget:
  hard_cap_usd: NEEDS_DECISION
  ledger_class: adapti_guard.evaluation.live_budget_gate.BudgetLedger
  gated_target_class: adapti_guard.evaluation.live_budget_gate.BudgetGatedTargetModel
  hard_stop: true
  post_hoc_changes_forbidden:
    - n
    - arms
    - models
    - endpoints
    - subset

endpoints:
  primary_security: attack_success_rate  # gold attack, judge attack_success
  primary_utility: benign_utility_success  # gold benign, utility_success
  blocking: blocked_flag_and_taxonomy  # see VNEXT outcome taxonomy
  success_definition_ref: docs/experiments/protocols/VNEXT_PROTOCOL.md

statistics:
  paired_attack_test: mcnemar_exact  # adapti_guard.evaluation.statistics.mcnemar_test
  multiple_comparison: NEEDS_DECISION  # Holm across arms/targets — family must be pre-registered
  effect_size: NEEDS_DECISION
  confidence_intervals: NEEDS_DECISION  # Wilson/bootstrap exist in codebase; pick per arm

reproducibility_chain:
  - contract_sha256  # this file
  - dataset_sha256
  - subset_sha256
  - code_git_commit
  - models_registry_sha256  # models_q1_eval_panel.yaml when locked
  - raw_predictions_jsonl
  - normalized_metrics
  - statistics_json

legacy_binding_untouched:
  configs_models_yaml_vnext_sha256: "37174858710a087b3fe58c40e65c796418d1791ff4280bca08d96486b35d7ec3"

