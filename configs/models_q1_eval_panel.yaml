    role: MT1_AUDIT_VALID_REFERENCE
    note: "Do not promote to primary without Owner Decision; MT1 immutable."
  judge_candidates:
    J1:
      model: z-ai/glm-4.7
      role: primary_all_confirmatory_judge_episodes
      repository_verification: openrouter_models_api_metadata
    J2:
      model: x-ai/grok-4.7
      role: preregistered_subset_only
      repository_verification: openrouter_models_api_metadata
  cost_control_principles:
