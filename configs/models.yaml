# Model configuration for ADAPTI-GUARD evaluation.
# API keys MUST come from environment (.env) — never store secrets here.
#
# Canonical Track L1 (human-gated; see docs/research/L1_CANONICAL_CONFIG.md):
#   target_2 + judge_fallback + OpenRouter backend
#   policies: B0 / STATIC-A1 / PHASE1-CORE
#   pack: datasets/frozen/p1_mechanism_v1.0.0/
# Do NOT use AUTO/groq/gemini backends or ORACLE_* for primary L1 results.

models:
  # --- Canonical Track L1 (and locked Phase-1 / VNEXT confirm keys) ---

  target_2:
    provider: openrouter
    model: qwen/qwen-2.5-7b-instruct
    temperature: 0.0
    max_tokens: 512
    description: "Canonical L1 / confirm target — qwen/qwen-2.5-7b-instruct (OpenRouter)"

  judge_fallback:
    provider: openrouter
    model: qwen/qwen-2.5-72b-instruct
    temperature: 0.0
    max_tokens: 512
    description: "Canonical L1 / confirm judge — qwen/qwen-2.5-72b-instruct (OpenRouter)"

  # --- Exploratory multi-model targets (EXP-004 / Stage C; not primary L1) ---

  model_a:
    provider: openrouter
    model: gemini-2.5-flash-mini
    temperature: 0.0
    max_tokens: 512
    description: "Exploratory target — gemini-2.5-flash-mini (OpenRouter)"

  model_b:
    provider: openrouter
    model: qwen/qwen3-30b-a3b
    temperature: 0.0
    max_tokens: 512
    description: "Exploratory target — qwen/qwen3-30b-a3b (OpenRouter)"

  # --- P3 Stage-C Q2 locked secondary targets (pre-result; no live auth) ---
  q2_t1:
    provider: openrouter
    model: qwen/qwen3-30b-a3b
    temperature: 0.0
    max_tokens: 512
    description: "P3-Q2 T1 locked — qwen/qwen3-30b-a3b (OpenRouter catalog verified)"

  q2_t2:
    provider: openrouter
    model: google/gemma-3-27b-it
    temperature: 0.0
    max_tokens: 512
    description: "P3-Q2 T2 locked — google/gemma-3-27b-it (OpenRouter catalog verified)"

  q2_t3:
    provider: openrouter
    model: qwen/qwen3.5-35b-a3b
    temperature: 0.0
    max_tokens: 512
    description: "P3-Q2 T3 locked — qwen/qwen3.5-35b-a3b (OpenRouter catalog verified)"

  model_c:
    provider: openrouter
    model: deepseek/deepseek-chat-v3-0324
    temperature: 0.0
    max_tokens: 512
    description: "Exploratory target — deepseek/deepseek-chat-v3-0324 (OpenRouter)"

  model_d:
    provider: openrouter
    model: anthropic/claude-sonnet-4
    temperature: 0.0
    max_tokens: 512
    description: "Optional exploratory target — anthropic/claude-sonnet-4 (OpenRouter)"
    optional: true

  # --- Alternate / provider-specific judges (not canonical L1) ---

  judge_primary:
    provider: groq
    model: openai/gpt-oss-120b
    temperature: 0.0
    max_tokens: 512
    description: "Alternate judge — openai/gpt-oss-120b (Groq); not canonical L1"

  judge:
    provider: openrouter
    model: anthropic/claude-sonnet-4
    temperature: 0.0
    max_tokens: 512
    description: "Alternate judge key — anthropic/claude-sonnet-4 (OpenRouter); not canonical L1"

  # --- Other retained keys (tests / historical scripts depend on these) ---

  target_1:
    provider: openrouter
    model: meta-llama/llama-3.1-8b-instruct
    temperature: 0.0
    max_tokens: 512
    description: "Historical/smoke target — meta-llama/llama-3.1-8b-instruct (OpenRouter)"

  target_3:
    provider: openrouter
    model: gemini-2.5-flash-mini
    temperature: 0.0
    max_tokens: 512
    description: "Alias of model_a — gemini-2.5-flash-mini (OpenRouter)"

  ollama_target:
    provider: ollama
    model: llama3.2:3b
    temperature: 0.0
    max_tokens: 512
    description: "Local Ollama target — llama3.2:3b (development only)"

  gemini_target:
    provider: google
    model: gemini-3.6-flash
    api: interactions
    temperature: 0.0
    max_tokens: 512
    seed: 42
    description: "Google Gemini target — gemini-3.6-flash (Interactions API)"

  gemini_judge:
    provider: google
    model: gemini-3.6-flash
    api: interactions
    temperature: 0.0
    max_tokens: 512
    seed: 42
    description: "Google Gemini judge — gemini-3.6-flash (Interactions API); not canonical L1"

  groq_target:
    provider: groq
    model: openai/gpt-oss-120b
    temperature: 0.0
    max_tokens: 512
    reasoning_effort: low
    description: "Groq target — openai/gpt-oss-120b; not canonical L1"

  groq_judge:
    provider: groq
    model: openai/gpt-oss-120b
    temperature: 0.0
    max_tokens: 512
    reasoning_effort: low
    description: "Groq judge — openai/gpt-oss-120b; not canonical L1"

  cerebras_judge:
    provider: cerebras
    model: qwen-3.8-27b
    temperature: 0.0
    max_tokens: 512
    description: "Cerebras judge — qwen-3.8-27b; not canonical L1"

# Default target set for multi-model evaluation (exploratory).
# Canonical L1 ignores this block and uses target_2 + judge_fallback only.
# With --backend openrouter, CLI --judge does NOT select the judge on some paths;
# OpenRouter multi_model path uses multi_model.judge via build_judge().
multi_model:
  targets: [model_a, model_b, model_c]
  optional_targets: [model_d]
  judge: judge_fallback
  judge_fallback: judge_fallback

openrouter:
  base_url: "https://openrouter.ai/api/v1"
  timeout_seconds: 120
  max_retries: 3
  retry_backoff_seconds: 2.0

groq:
  base_url: "https://api.groq.com/openai/v1"
  timeout_seconds: 120
  max_retries: 3
  retry_backoff_seconds: 2.0
  reasoning_effort: low

cerebras:
  base_url: "https://api.cerebras.ai/v1"
  timeout_seconds: 120
  max_retries: 4
  retry_backoff_seconds: 2.0

ollama:
  base_url: "http://localhost:11434/v1"
  timeout_seconds: 120
  max_retries: 2
  retry_backoff_seconds: 1.0

google:
  api: interactions
  timeout_seconds: 120
  max_retries: 10
  retry_backoff_seconds: 35.0
  # Free-tier RPM=20 for gemini-3.6-flash; 6s ⇒ ~10 RPM with margin.
  min_request_interval_seconds: 6.0
  seed: 42
  # Interactions generation_config supports seed + max_output_tokens.
  # temperature and top_p are NOT supported by this API path.
  # Free-tier generate_content RPM is 20; honor Retry-After on 429.

cache:
  enabled: false
  directory: ".llm_cache"
