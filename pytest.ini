[pytest]
testpaths = tests
pythonpath = . src
# `src` remains so editable-uninstalled checkouts still resolve adapti_guard via package-dir
addopts = --import-mode=importlib
markers =
    llm: tests that require OPENROUTER_API_KEY and live API (opt-in via RUN_LLM_TESTS=1)
    stage_b: tests that require Stage-B raw traces locally (skip when MISSING_LOCALLY)
norecursedirs =
    .git
    .venv
    dataset/raw
    BIPIA
